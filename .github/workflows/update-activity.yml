name: Update README Activity

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-activity
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update Profile README

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch recent public activity and update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const username = 'nsoni44';
            const maxLines = 5;
            const readmePath = 'README.md';
            const startMarker = '<!--START_SECTION:activity-->';
            const endMarker = '<!--END_SECTION:activity-->';

            const response = await github.request('GET /users/{username}/events/public', {
              username,
              per_page: 100,
              headers: {
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });

            if (!Array.isArray(response.data)) {
              core.setFailed('Expected an array of public events from GitHub API.');
              return;
            }

            const formatEvent = (event) => {
              const repo = event.repo?.name || 'unknown repo';
              const type = event.type || 'UnknownEvent';

              switch (type) {
                case 'PushEvent': {
                  const commits = event.payload?.commits?.length || 0;
                  return `- Pushed ${commits} commit(s) to \`${repo}\``;
                }
                case 'CreateEvent':
                  return `- Created ${event.payload?.ref_type || 'resource'} in \`${repo}\``;
                case 'IssuesEvent':
                  return `- ${event.payload?.action || 'Updated'} an issue in \`${repo}\``;
                case 'IssueCommentEvent':
                  return `- Commented on an issue in \`${repo}\``;
                case 'PullRequestEvent':
                  return `- ${event.payload?.action || 'Updated'} a pull request in \`${repo}\``;
                case 'WatchEvent':
                  return `- Starred \`${repo}\``;
                case 'ForkEvent':
                  return `- Forked \`${repo}\``;
                case 'ReleaseEvent':
                  return `- ${event.payload?.action || 'Updated'} a release in \`${repo}\``;
                case 'PublicEvent':
                  return `- Open sourced \`${repo}\``;
                default:
                  return `- ${type.replace(/Event$/, '')} on \`${repo}\``;
              }
            };

            const lines = response.data
              .filter(Boolean)
              .slice(0, maxLines)
              .map(formatEvent);

            const replacement = `${startMarker}\n${lines.join('\n') || '- No recent activity found.'}\n${endMarker}`;

            const readme = fs.readFileSync(readmePath, 'utf8');

            if (!readme.includes(startMarker) || !readme.includes(endMarker)) {
              core.setFailed(`README.md is missing required markers: ${startMarker} ... ${endMarker}`);
              return;
            }

            const updated = readme.replace(
              new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`, 'm'),
              replacement
            );

            if (updated === readme) {
              core.info('README activity section is already up to date.');
              return;
            }

            fs.writeFileSync(readmePath, updated);
            core.info('README.md updated successfully.');

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update activity in profile README"
          git push
